<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700">
  <style>
    .box { fill: #f7f9fc; stroke: #334155; stroke-width: 2; }
    .title { font: bold 18px sans-serif; fill: #0f172a; }
    .text { font: 14px sans-serif; fill: #0f172a; }
    .arrow { stroke: #0f172a; stroke-width: 2; marker-end: url(#arrowhead); }
    .divider { stroke: #94a3b8; stroke-width: 1; }
  </style>
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#0f172a" />
    </marker>
  </defs>

  <rect x="50" y="40" width="260" height="120" class="box" rx="10" />
  <text x="80" y="70" class="title">Testing</text>
  <text x="80" y="95" class="text">+ main(String[] args)</text>
  <text x="80" y="115" class="text">- viewAvailableTimes()</text>
  <text x="80" y="135" class="text">- bookAppointment()</text>

  <rect x="50" y="210" width="260" height="90" class="box" rx="10" />
  <text x="80" y="245" class="title">AvailabilityService</text>
  <text x="80" y="270" class="text">+ getAvailableTimes(Counselor)</text>

  <rect x="450" y="40" width="290" height="90" class="box" rx="10" />
  <text x="490" y="70" class="title">Counselor</text>
  <text x="490" y="95" class="text">- name</text>
  <text x="490" y="115" class="text">- availability</text>

  <rect x="450" y="170" width="370" height="140" class="box" rx="10" />
  <text x="485" y="200" class="title">Availability</text>
  <text x="485" y="225" class="text">- typicalAvailibility</text>
  <text x="485" y="245" class="text">- daysOff</text>
  <text x="485" y="265" class="text">- unavailableTimeRanges</text>
  <text x="485" y="285" class="text">- bookedSlots</text>

  <rect x="450" y="360" width="240" height="80" class="box" rx="10" />
  <text x="485" y="395" class="title">Booking</text>
  <text x="485" y="420" class="text">- studentId</text>
  <text x="485" y="440" class="text">- counselerName</text>
  <text x="485" y="460" class="text">- time</text>

  <rect x="450" y="460" width="290" height="90" class="box" rx="10" />
  <text x="490" y="495" class="title">TypicalAvailability</text>
  <text x="490" y="520" class="text">- activeDays</text>
  <text x="490" y="540" class="text">- availableTimeRanges</text>

  <rect x="860" y="170" width="240" height="70" class="box" rx="10" />
  <text x="895" y="200" class="title">TimeRange</text>
  <text x="895" y="225" class="text">- start</text>
  <text x="895" y="245" class="text">- end</text>

  <rect x="860" y="270" width="240" height="70" class="box" rx="10" />
  <text x="895" y="300" class="title">DateRange</text>
  <text x="895" y="325" class="text">- startDate</text>
  <text x="895" y="345" class="text">- endDate</text>

  <line x1="310" y1="100" x2="450" y2="100" class="arrow" />
  <line x1="310" y1="255" x2="450" y2="255" class="arrow" />

  <line x1="740" y1="125" x2="860" y2="205" class="arrow" />
  <line x1="740" y1="265" x2="860" y2="205" class="arrow" />
  <line x1="740" y1="305" x2="860" y2="305" class="arrow" />
  <line x1="740" y1="405" x2="860" y2="305" class="arrow" />
  <line x1="690" y1="495" x2="860" y2="235" class="arrow" />

  <line x1="615" y1="315" x2="615" y2="360" class="arrow" />
</svg>
